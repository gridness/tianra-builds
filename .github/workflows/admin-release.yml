name: Admin release
run-name: Admin ${{ inputs.source_sha || 'requested build' }}

on:
  push:
    branches: [main]
    paths: [requests/beta.json]

  workflow_dispatch:
    inputs:
      source_sha:
        description: Full private main commit to publish
        required: true
        type: string

      force:
        description: Rebuild even when Admin inputs have not changed
        default: false
        type: boolean

concurrency:
  group: tianra-admin-publication
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash
    working-directory: source

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      source: ${{ steps.source.outputs.source }}
      admin: ${{ steps.plan.outputs.admin }}

    steps:
      - name: Check out build orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Select the Admin source
        id: source
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: python3 .github/tools/admin.py select

      - name: Check out private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gridness/tianra
          ref: ${{ steps.source.outputs.source }}
          path: source
          ssh-key: ${{ secrets.TIANRA_SOURCE_READ_KEY }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify private main ancestry
        working-directory: ${{ github.workspace }}
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source }}
        run: python3 .github/tools/request.py verify "$SOURCE_SHA"

      - name: Find the last successful Admin source
        id: baseline
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/tools/admin.py baseline

      - name: Plan affected Admin inputs
        id: plan
        env:
          BASE: ${{ steps.baseline.outputs.base }}
          FORCE: ${{ inputs.force || false }}
        run: python3 .github/tools/plan_admin.py --base "$BASE" --force "$FORCE"

      - run: python3 -m unittest discover -s .github/tests -v

      - run: python3 tools/audit_import.py --working-tree

  admin:
    needs: plan
    if: needs.plan.outputs.admin == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      TIANRA_TARGET: macos-aarch64
      TIANRA_BUILD: ${{ github.run_number }}

    steps:
      - name: Check out build orchestration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Check out private source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: gridness/tianra
          ref: ${{ needs.plan.outputs.source }}
          path: source
          ssh-key: ${{ secrets.TIANRA_SOURCE_READ_KEY }}
          persist-credentials: false

      - run: python3 .github/tools/ci_setup.py rust native

      # Share the existing bounded macOS cache family with player builds.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: cache
        with:
          path: source/target
          key: macos-aarch64-1.99.0-release-v4-${{ hashFiles('source/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            macos-aarch64-1.99.0-release-v4-${{ hashFiles('source/Cargo.lock') }}-
            macos-aarch64-1.99.0-release-v4-

      - name: Build only Admin
        run: python3 .github/tools/ci.py build admin
        env:
          TIANRA_RELEASE_PUBLIC_KEY: ${{ vars.TIANRA_RELEASE_PUBLIC_KEY }}
          TIANRA_CACHE_HIT: ${{ steps.cache.outputs.cache-matched-key != '' }}

      - name: Verify native DMG packaging
        run: python3 -m unittest discover -s .github/tests -p test_admin_package.py -v

      - name: Assemble and verify the Admin disk image
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: python3 apps/server/tools/package_admin.py installer --build "$TIANRA_BUILD" --source "$SOURCE_SHA"

      - run: python3 .github/tools/ci_setup.py butler

      - name: Publish and verify the restricted Admin download
        env:
          # ASVS 13.3.1/13.3.2: reuse the asset credential only in publication.
          ITCH_PUBLISH_TOKEN: ${{ secrets.ITCH_PUBLISH_TOKEN }}
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: python3 apps/server/tools/package_admin.py publish --build "$TIANRA_BUILD" --source "$SOURCE_SHA"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: admin-receipt
          path: source/.local/receipts/admin-macos-aarch64.json
          retention-days: 7
          include-hidden-files: true

      - name: Record the Admin download
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source }}
        run: |
          echo "Admin Build $TIANRA_BUILD from $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Download: https://theoosama.itch.io/tianra-admin" >> "$GITHUB_STEP_SUMMARY"

      - run: python3 "$GITHUB_WORKSPACE/.github/tools/cache.py" --mib 2048 --profile release
        id: prune
        if: always() && !cancelled()

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always() && !cancelled() && steps.prune.outcome == 'success' && steps.prune.outputs.cache_ready == 'true' && steps.cache.outputs.cache-primary-key != '' && steps.cache.outputs.cache-hit != 'true'
        with:
          path: source/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
