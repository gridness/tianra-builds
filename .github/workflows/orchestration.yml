name: Orchestration checks

on:
  push:
    branches: [main]
    paths: [.github/**]
  pull_request:
    paths: [.github/**]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - run: python3 -m unittest discover -s .github/tests -v
